name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minitraxx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK zusätzlich auf den Branch apk-dist pushen, damit sie per git
      # abholbar ist (Artifact-Download ist nicht überall erreichbar).
      - name: Publish APK to apk-dist branch
        if: github.ref == 'refs/heads/claude/claude-md-review-052dfg'
        run: |
          mkdir /tmp/apkpub && cd /tmp/apkpub
          git init -b apk-dist
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" MiniTraxx-debug.apk
          git add MiniTraxx-debug.apk
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "MiniTraxx debug APK (build $GITHUB_SHA)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
